name: n8n MCP write

on:
  push:
    branches:
      - main
      - feat/n8n-mcp-client
    paths:
      - "n8n-mcp/write-request.json"

permissions:
  contents: read

concurrency:
  group: n8n-mcp-write-${{ github.ref }}
  queue: max

jobs:
  write:
    if: github.actor == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      N8N_MCP_URL: ${{ vars.N8N_MCP_URL }}
      N8N_MCP_TOKEN: ${{ secrets.N8N_MCP_TOKEN }}
      REPO_VISIBILITY: ${{ github.event.repository.visibility }}
      MCP_REQUEST_FILE: n8n-mcp/write-request.json
      MCP_WRITE_ONLY: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a single-purpose request push
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mapfile -t CHANGED < <(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")
          printf 'Changed files:\n%s\n' "${CHANGED[*]}"
          if [ "${#CHANGED[@]}" -ne 1 ] || [ "${CHANGED[0]}" != "n8n-mcp/write-request.json" ]; then
            echo "Write pushes must change only n8n-mcp/write-request.json"
            exit 1
          fi

      - name: Verify configuration
        shell: bash
        run: |
          test -n "$N8N_MCP_URL" || (echo "N8N_MCP_URL repository variable is missing" && exit 1)
          test -n "$N8N_MCP_TOKEN" || (echo "N8N_MCP_TOKEN secret is missing" && exit 1)

      - name: Validate request envelope
        id: gate
        shell: bash
        env:
          CURRENT_REF: ${{ github.ref }}
        run: |
          node <<'NODE' > /tmp/mcp-write-gate.env
          const r = require('./n8n-mcp/write-request.json');
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          if (typeof r.requestId !== 'string' || !uuid.test(r.requestId)) {
            throw new Error('requestId must be a UUID');
          }
          if (typeof r.targetRef !== 'string' || r.targetRef !== process.env.CURRENT_REF) {
            throw new Error('targetRef does not match github.ref');
          }
          process.stdout.write('confirmed=' + String(r.confirmWrite === true) + '\n');
          NODE
          cat /tmp/mcp-write-gate.env >> "$GITHUB_OUTPUT"
          if ! grep -q '^confirmed=true

      - name: Invoke write-only n8n MCP tool
        if: steps.gate.outputs.confirmed == 'true'
        run: node n8n-mcp/src/invoke.mjs

      - name: Upload sanitized write result
        if: steps.gate.outputs.confirmed == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: n8n-mcp-write-result
          path: n8n-mcp/out/result.json
          if-no-files-found: warn
          retention-days: 1
 /tmp/mcp-write-gate.env; then
            echo "Write request is parked: confirmWrite is not true. No MCP connection will be opened."
          fi

      - name: Invoke write-only n8n MCP tool
        if: steps.gate.outputs.confirmed == 'true'
        run: node n8n-mcp/src/invoke.mjs

      - name: Upload sanitized write result
        if: steps.gate.outputs.confirmed == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: n8n-mcp-write-result
          path: n8n-mcp/out/result.json
          if-no-files-found: warn
          retention-days: 1
