name: Puerto Plata GIS - build and verify
on:
  push:
    branches: ["feat/puerto-plata-transit-gis", dev]
    paths: ["projects/puerto-plata-gis/**", ".github/workflows/puerto-plata-gis.yml"]
  pull_request:
    paths: ["projects/puerto-plata-gis/**", ".github/workflows/puerto-plata-gis.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install rasterio
      - name: Generate geospatial population layer from WorldPop 2025
        run: python projects/puerto-plata-gis/build_population.py
      - name: Build provisional OSM/OSRM route
        run: python projects/puerto-plata-gis/build_route.py
      - name: Retrieve OSM road metadata (graceful fallback)
        run: python projects/puerto-plata-gis/build_roads.py
      - name: Build standalone interactive HTML
        run: python projects/puerto-plata-gis/make_standalone.py
      - name: Verify files and provenance
        run: python projects/puerto-plata-gis/verify.py
      - name: Check browser inline JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class X(HTMLParser):
              def __init__(self): super().__init__(); self.inside=False; self.parts=[]
              def handle_starttag(self,t,a):
                  if t=="script" and "src" not in dict(a): self.inside=True
              def handle_endtag(self,t):
                  if t=="script": self.inside=False
              def handle_data(self,d):
                  if self.inside: self.parts.append(d)
          x=X();x.feed(Path("projects/puerto-plata-gis/index.html").read_text());Path("/tmp/puerto-plata.js").write_text("\n".join(x.parts))
          PY
          node --check /tmp/puerto-plata.js
      - uses: actions/upload-artifact@v4
        with:
          name: puerto-plata-gis-completo
          path: |
            projects/puerto-plata-gis/index.html
            projects/puerto-plata-gis/population.json
            projects/puerto-plata-gis/initial_route.geojson
            projects/puerto-plata-gis/roads.geojson
            projects/puerto-plata-gis/Puerto_Plata_Linea_1_Mapa_Interactivo.html
            projects/puerto-plata-gis/README.md
          retention-days: 30

  network:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install graph dependencies
        run: python -m pip install "osmnx==2.0.6" "networkx>=3.4,<4"
      - name: Set weekly OSM snapshot key
        id: snapshot
        run: echo "week=$(date -u +%Y-%W)" >> "$GITHUB_OUTPUT"
      - name: Restore weekly OSM street graph snapshot
        id: osm-cache
        uses: actions/cache@v4
        with:
          path: |
            projects/puerto-plata-gis/drive.graphml
            projects/puerto-plata-gis/walk.graphml
            projects/puerto-plata-gis/drive_network.geojson
            projects/puerto-plata-gis/walk_network.geojson
            projects/puerto-plata-gis/network_report.json
          key: osm-puerto-plata-2026-v1-${{ hashFiles('projects/puerto-plata-gis/build_network.py') }}-${{ steps.snapshot.outputs.week }}
      - name: Download directed road and pedestrian networks (cache miss)
        if: steps.osm-cache.outputs.cache-hit != 'true'
        run: python projects/puerto-plata-gis/build_network.py
      - name: Verify network export
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('projects/puerto-plata-gis')
          r=json.loads((p/'network_report.json').read_text())
          for kind in ('drive','walk'):
              assert r['networks'][kind]['nodes']>100
              assert r['networks'][kind]['directed_edges']>100
              g=json.loads((p/f'{kind}_network.geojson').read_text())
              assert len(g['features'])==r['networks'][kind]['directed_edges']
              assert (p/f'{kind}.graphml').stat().st_size>1000
          print('Verified directed networks',r['networks'])
          PY
      - name: Publish network graphs
        uses: actions/upload-artifact@v4
        with:
          name: puerto-plata-red-vial-osmnx
          path: |
            projects/puerto-plata-gis/drive.graphml
            projects/puerto-plata-gis/walk.graphml
            projects/puerto-plata-gis/drive_network.geojson
            projects/puerto-plata-gis/walk_network.geojson
            projects/puerto-plata-gis/network_report.json
          retention-days: 30

  road-width-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Validate local interactive HTML JavaScript and required controls
        run: |
          python projects/puerto-plata-gis/check_review_html.py \
            projects/puerto-plata-gis/Road_Width_Review_Puerto_Plata.html \
            projects/puerto-plata-gis/Road_Width_Manual_Review.html
          python - <<'PY'
          from pathlib import Path
          p=Path("projects/puerto-plata-gis")
          review=(p/"Road_Width_Review_Puerto_Plata.html").read_text()
          manual=(p/"Road_Width_Manual_Review.html").read_text()
          assert 'id="surveyQueue"' in review
          assert 'id="export"' in manual
          assert "review_status:'unreviewed'" in manual
          assert "csvCell(row[k],k)" in manual
          print("Review UI controls present")
          PY

  road-width-raster-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install geospatial raster test dependencies
        run: python -m pip install "numpy>=1.26,<3" "rasterio>=1.4,<2" "shapely>=2,<3" "pyproj>=3.6,<4"
      - name: Execute synthetic calibrated road-mask measurement tests
        run: |
          cd projects/puerto-plata-gis
          python -m unittest -v test_road_mask_measure.py
          python -m py_compile road_mask_measure.py

  imagery-catalog-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Query current HOT OpenAerialMap STAC imagery
        run: |
          python projects/puerto-plata-gis/discover_open_aerial.py --output projects/puerto-plata-gis/open_aerial_metadata.json --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puerto-plata-imagery-search-evidence
          path: projects/puerto-plata-gis/open_aerial_metadata.json
          if-no-files-found: error
          retention-days: 30

  road-width-baseline:
    runs-on: ubuntu-latest
    needs: [network]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-red-vial-osmnx
          path: projects/puerto-plata-gis
      - name: Evaluate imagery eligibility without presuming access
        run: |
          python projects/puerto-plata-gis/imagery_eligibility.py --catalog projects/puerto-plata-gis/imagery_catalog.json --output projects/puerto-plata-gis/imagery_eligibility_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("projects/puerto-plata-gis/imagery_eligibility_report.json").read_text())
          assert x["status"] == "BLOCKED_NO_ELIGIBLE_IMAGERY"
          PY
      - name: Inventory measured or missing road widths without inventing data
        run: |
          python projects/puerto-plata-gis/road_widths_pipeline.py \
            --roads projects/puerto-plata-gis/drive_network.geojson \
            --sources projects/puerto-plata-gis/road_width_sources.json \
            --output projects/puerto-plata-gis/road_width_baseline.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("projects/puerto-plata-gis/road_width_baseline.json").read_text())
          assert x["roads"]["road_features"] > 100
          assert x["geometry_approved"] is False
          assert x["measurements_count"] == 0
          assert x["status"] == "NO_MEASUREMENTS_LICENSED_OR_REVIEWED"
          print("Baseline inventory:",x["roads"])
          PY
      - name: Generate provisional cross sections for inspection
        run: |
          python projects/puerto-plata-gis/road_width_transects.py --roads projects/puerto-plata-gis/drive_network.geojson --output projects/puerto-plata-gis/road_width_transects.geojson
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("projects/puerto-plata-gis/road_width_transects.geojson").read_text())
          assert len(x["features"])>100
          assert all(f["properties"]["status"]=="INSPECTION_TRANSECT_NOT_MEASURED" for f in x["features"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: puerto-plata-road-width-baseline
          path: |
            projects/puerto-plata-gis/road_width_baseline.json
            projects/puerto-plata-gis/road_width_transects.geojson
            projects/puerto-plata-gis/road_width_sources.json
            projects/puerto-plata-gis/imagery_eligibility_report.json
          retention-days: 30

  destinations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install Overture Maps downloader
        run: python -m pip install "overturemaps>=0.16,<1"
      - name: Retrieve and classify POIs
        run: python projects/puerto-plata-gis/build_destinations.py
      - name: Verify nonempty georeferenced POIs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('projects/puerto-plata-gis')
          d=json.loads((base/'destinations.geojson').read_text())
          s=json.loads((base/'destinations_report.json').read_text())
          assert d['type']=='FeatureCollection'
          assert len(d['features'])==s['classified'] and len(d['features'])>0
          for p in d['features']:
              x,y=p['geometry']['coordinates'][:2]
              assert -70.752<=x<=-70.620 and 19.740<=y<=19.836
              assert p['properties']['name'] and p['properties']['type']!='other'
          print('Verified Overture POIs:',s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: puerto-plata-destinos-overture
          path: |
            projects/puerto-plata-gis/destinations.geojson
            projects/puerto-plata-gis/destinations_report.json
          retention-days: 30

  service-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Test schedule, frequency, fleet and transfer assumptions
        run: |
          cd projects/puerto-plata-gis
          python -m unittest -v test_transit_planner.py
          python transit_planner.py --output network_scenarios.json
          python - <<'PY'
          import json
          p=json.load(open('network_scenarios.json'))
          assert p['results']['fleet']['fleet_total']==21
          assert len(p['results']['periods'])==6
          print('Plan validated:',p['results']['fleet'])
          PY
      - name: Validate offline planner JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Parser(HTMLParser):
              def __init__(self):super().__init__();self.active=False;self.text=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="script" and not any(k=="src" for k,_ in attrs):self.active=True
              def handle_endtag(self,tag):
                  if tag=="script":self.active=False
              def handle_data(self,d):
                  if self.active:self.text.append(d)
          p=Parser();p.feed(Path('projects/puerto-plata-gis/frequency_planner.html').read_text())
          Path('/tmp/puerto-plata-frequency.js').write_text('\n'.join(p.text))
          PY
          node --check /tmp/puerto-plata-frequency.js
      - uses: actions/upload-artifact@v4
        with:
          name: puerto-plata-frecuencias-transbordos
          path: |
            projects/puerto-plata-gis/frequency_planner.html
            projects/puerto-plata-gis/network_scenarios.json
            projects/puerto-plata-gis/transit_planner.py
            projects/puerto-plata-gis/test_transit_planner.py
          retention-days: 30

  synthetic-od:
    runs-on: ubuntu-latest
    needs: [package, destinations]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify synthetic origin-destination model
        run: |
          cd projects/puerto-plata-gis
          python -m unittest -v test_od_synthetic.py
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-gis-completo
          path: projects/puerto-plata-gis
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-destinos-overture
          path: projects/puerto-plata-gis
      - name: Generate time-of-day OD opportunity matrix
        run: |
          python projects/puerto-plata-gis/build_od_synthetic.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('projects/puerto-plata-gis/od_synthetic.json').read_text())
          assert len(p['periods'])==6
          assert p['resident_coverage_estimate']>0
          assert p['metadata']['method'].startswith('synthetic')
          print('Synthetic, non-observed OD report validated')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: puerto-plata-od-sintetica
          path: projects/puerto-plata-gis/od_synthetic.json
          retention-days: 30

  street-access:
    runs-on: ubuntu-latest
    needs: [network, package, destinations]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install geographic graph analysis
        run: python -m pip install "osmnx==2.0.6" "networkx>=3.4,<4" scipy
      - name: Regression tests for street access
        run: |
          cd projects/puerto-plata-gis
          python -m unittest -v test_network_access.py test_network_scenarios.py
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-red-vial-osmnx
          path: projects/puerto-plata-gis
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-gis-completo
          path: projects/puerto-plata-gis
      - name: Estimate 500m directed street access
        run: |
          python projects/puerto-plata-gis/network_access.py --sensitivity
          python - <<'PY'
          import json
          p=json.load(open("projects/puerto-plata-gis/network_access_report.json"))
          assert p["total_stops"]>=20 and p["snapped_stops"]>=15
          assert p["residents"]>0 and p["residents"]<=45000
          assert p["accounting_difference"]==0
          assert len(p["sensitivity"])==3
          assert p["population_outside_study_bbox"]>0
          print("Street network access:",p)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-destinos-overture
          path: projects/puerto-plata-gis
      - name: Compare network-wide walking access
        run: |
          python projects/puerto-plata-gis/compare_network_scenarios.py
          python -c "import json; d=json.load(open('projects/puerto-plata-gis/network_scenario_comparison.json')); assert len(d['scenarios']) == 1; assert not d['scenarios'][0]['bus_geometry_validated']"
      - uses: actions/upload-artifact@v4
        with:
          name: puerto-plata-acceso-peatonal-red
          path: |
            projects/puerto-plata-gis/network_access_report.json
            projects/puerto-plata-gis/network_scenario_comparison.json
          retention-days: 30

  route-competition:
    runs-on: ubuntu-latest
    needs: [network, package, destinations]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install graph search dependencies
        run: python -m pip install "osmnx==2.0.6" scipy
      - name: Test candidate ranking invariants
        run: |
          cd projects/puerto-plata-gis
          python -m unittest -v test_discover_transit_network.py
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-red-vial-osmnx
          path: projects/puerto-plata-gis
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-gis-completo
          path: projects/puerto-plata-gis
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-destinos-overture
          path: projects/puerto-plata-gis
      - name: Discover competitor corridors and complementary networks
        run: |
          python projects/puerto-plata-gis/discover_transit_network.py --max-candidates 18
          python projects/puerto-plata-gis/render_route_competition.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("projects/puerto-plata-gis")
          r=json.loads((p/"route_competition.json").read_text())
          assert r["metadata"]["candidates"] >= 3
          assert len(r["network_combinations"]) >= 3
          assert all(not c["operationally_validated"] for c in r["network_combinations"])
          assert all(c["incremental_residents"] >= 0 for c in r["network_combinations"])
          print("Competition verified; unvalidated corridors:",r["metadata"]["candidates"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: puerto-plata-competencia-redes
          path: |
            projects/puerto-plata-gis/route_competition.json
            projects/puerto-plata-gis/discovered_routes.geojson
            projects/puerto-plata-gis/discover_transit_network.py
            projects/puerto-plata-gis/Competencia_Rutas_Puerto_Plata.html
          retention-days: 30

  environment-factors:
    runs-on: ubuntu-latest
    needs: [package]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-gis-completo
          path: projects/puerto-plata-gis
      - name: Install image sampling dependency
        run: python -m pip install "Pillow>=10,<13"
      - name: Sample terrain on proposed L1 stops
        run: python projects/puerto-plata-gis/build_terrain.py
      - name: Download NASA POWER climate reference
        run: python projects/puerto-plata-gis/build_climate.py
      - name: Check geographic and climatological provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("projects/puerto-plata-gis")
          terrain=json.loads((p/"terrain_stops.json").read_text())
          climate=json.loads((p/"climate_context.json").read_text())
          assert len(terrain["stops"])>=20
          assert len(climate["locations"])==3
          assert all(-70.84 < s["lon"] < -70.55 and 19.68 < s["lat"] < 19.88 for s in terrain["stops"])
          print("Climate and terrain downloaded and spatially verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: puerto-plata-ambiente-terreno
          path: |
            projects/puerto-plata-gis/terrain_stops.json
            projects/puerto-plata-gis/climate_context.json
          retention-days: 30
  valhalla-bus-audit:
    runs-on: ubuntu-latest
    needs: [route-competition]
    timeout-minutes: 12
    env:
      VALHALLA_URL: ${{ secrets.PUERTO_PLATA_VALHALLA_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-competencia-redes
          path: projects/puerto-plata-gis
      - name: Route candidate terminals with Valhalla bus costing (if configured)
        run: python projects/puerto-plata-gis/valhalla_audit.py
      - name: Verify unsupported claims stay unvalidated
        run: |
          python - <<'PY'
          import json
          d=json.load(open("projects/puerto-plata-gis/valhalla_audit.json"))
          assert d["routes"] and all(not r["terminal_turn_validated"] for r in d["routes"])
          if not d["backend_configured"]:assert d["status"]=="unconfigured_no_routing_claim"
          print("Valhalla integration:",d["status"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: puerto-plata-valhalla-audit
          path: projects/puerto-plata-gis/valhalla_audit.json
          retention-days: 30

  local-valhalla-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Unit-test local Valhalla actor adapter without network service
        run: |
          cd projects/puerto-plata-gis
          python -m unittest -v test_service_cycle_scenarios.py test_valhalla_waypoint_route.py test_valhalla_route_shape.py test_valhalla_local.py test_operational_validation.py test_turn_risk_screen.py test_road_widths_pipeline.py test_road_width_transects.py test_imagery_eligibility.py test_road_width_priorities.py test_discover_open_aerial.py test_survey_priority_queue.py
          python -m py_compile valhalla_local.py operational_validation.py

  local-r5py:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Unit-test travel time and reachability calculations
        run: |
          cd projects/puerto-plata-gis
          python -m unittest -v test_r5_accessibility.py
          python -m py_compile r5_accessibility.py
      - name: Verify current r5py can be installed and imported
        run: |
          python -m pip install "r5py>=1.1.0,<2"
          python - <<'PY'
          import r5py
          assert hasattr(r5py,'TransportNetwork')
          assert hasattr(r5py,'TravelTimeMatrix')
          assert hasattr(r5py.TransportMode,'WALK')
          assert hasattr(r5py.TransportMode,'TRANSIT')
          print('Local r5py API OK',getattr(r5py,'__version__','version unknown'))
          PY

  policy-and-optimization:
    runs-on: ubuntu-latest
    needs: [package, destinations]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install local computational libraries
        run: python -m pip install "ortools>=9.10,<10" "pyproj>=3.6,<4" "shapely>=2,<3"
      - name: Test fleet control and fail-closed gates
        run: |
          cd projects/puerto-plata-gis
          python -m unittest -v test_fleet_optimization.py test_optimize_headways.py test_audit_counts.py test_prepare_optimization_input.py
          python -m py_compile phase_gates.py optimize_headways.py audit_counts.py
          python phase_gates.py --output phase_gates.json
          python - <<'PY'
          import json
          r=json.load(open('phase_gates.json'))
          assert len(r['phase_gates'])==10
          assert all(x['status']=='BLOQUEADO' for x in r['phase_gates'])
          print('Phase gates blocked pending objective evidence')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-gis-completo
          path: projects/puerto-plata-gis
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-destinos-overture
          path: projects/puerto-plata-gis
      - name: Validate actual GIS geometries and CRS conversion
        run: |
          python projects/puerto-plata-gis/validate_spatial.py
          python - <<'PY'
          import json
          p=json.load(open('projects/puerto-plata-gis/spatial_validation.json'))
          assert p['target_crs']=='EPSG:32619'
          assert p['status']=='VALIDADO_GEOMETRICAMENTE'
          print('GIS geometry and CRS validated; engineering phases remain BLOCKED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: puerto-plata-aceptacion-y-configuracion
          path: |
            projects/puerto-plata-gis/phase_gates.json
            projects/puerto-plata-gis/spatial_validation.json
            projects/puerto-plata-gis/study_config.json
          retention-days: 30

  valhalla-local-real-tiles:
    runs-on: ubuntu-latest
    needs: [route-competition]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install Valhalla in-process bindings and tile builder
        run: python -m pip install "pyvalhalla"
      - name: Download Dominican Republic OSM extract with provenance
        run: |
          mkdir -p projects/puerto-plata-gis/data/osm
          curl -fL --retry 3 --connect-timeout 20 --max-time 360 \
            https://download.openstreetmap.fr/extracts/central-america/dominican_republic-latest.osm.pbf \
            -o projects/puerto-plata-gis/data/osm/dominican_republic.osm.pbf
          test "$(stat -c%s projects/puerto-plata-gis/data/osm/dominican_republic.osm.pbf)" -gt 1000000
          sha256sum projects/puerto-plata-gis/data/osm/dominican_republic.osm.pbf
      - name: Build Valhalla tiles locally
        run: |
          python projects/puerto-plata-gis/build_valhalla_local_tiles.py \
            --osm-pbf projects/puerto-plata-gis/data/osm/dominican_republic.osm.pbf \
            --output-dir projects/puerto-plata-gis/data/valhalla
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-competencia-redes
          path: projects/puerto-plata-gis
      - name: Route proposed corridors in both directions using pyvalhalla Actor
        run: |
          python projects/puerto-plata-gis/valhalla_local.py \
            --tiles projects/puerto-plata-gis/data/valhalla/valhalla_tiles.tar \
            --limit 19
          python - <<'PY'
          import json
          p="projects/puerto-plata-gis/valhalla_local_audit.json"
          d=json.load(open(p))
          assert d["routes"], "no routes evaluated"
          assert all(not r["bus_geometry_validated"] for r in d["routes"])
          print("Local Valhalla candidates:",len(d["routes"]))
          print("Bidirectional route connectivity:",sum(r["routed_both_directions"] for r in d["routes"]))
          print("Physical bus turn approvals: 0 (require swept-path audit)")
          PY
      - name: Screen Yutong waypoint bend candidates
        run: |
          python projects/puerto-plata-gis/turn_risk_screen.py --input projects/puerto-plata-gis/discovered_routes.geojson --output projects/puerto-plata-gis/yutong_turn_risk_screen.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("projects/puerto-plata-gis/yutong_turn_risk_screen.json").read_text())
          assert d["status"]=="EXPLORATORIO_SIN_APROBACION_FISICA"
          assert len(d["risks"])>0
          PY
      - name: Check whether three routes visit their ordered provisional waypoints
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("projects/puerto-plata-gis/valhalla_waypoint_constrained.json").read_text())
          assert len(r["routes"])==3
          assert {r0["id"] for r0 in r["routes"]}=={"C00-09","C00-10","C02-04"}
          assert r["physical_routes_approved"]==0
          assert all(r0["segments"] for r0 in r["routes"])
          print("Waypoint route evidence:",[(x["id"],x["complete_routable_sequence"],x["failed_segments"],x["sum_segment_distance_km"]) for x in r["routes"]])
          PY
      - name: Compare terminal shortcuts against waypoint-constrained routing
        run: |
          cd projects/puerto-plata-gis
          python -m unittest -v test_route_length_comparison.py
          python route_length_comparison.py --direct valhalla_local_audit.json --via valhalla_waypoint_constrained.json --output route_length_comparison.json
          python - <<'PY'
          import json
          x=json.load(open('route_length_comparison.json'))
          assert x["total_compared"]==3
          assert x["maneuvers_approved"]==0
          assert all(x0["constraint_sequence_complete"] for x0 in x["routes"])
          PY
      - name: Verify waypoint paths are not falsely labeled as bus service cycles
        run: |
          cd projects/puerto-plata-gis
          python -m unittest -v test_cycle_readiness.py
          python cycle_readiness.py --input valhalla_waypoint_constrained.json --output cycle_readiness.json
          python - <<'PY'
          import json
          x=json.load(open("cycle_readiness.json"))
          assert x["routes_examined"]==3
          assert x["approved_as_measured_cycles"]==0
          PY
      - name: Validate hypothetical full bus graph loops with terminal connectors
        run: |
          cd projects/puerto-plata-gis
          python -m unittest -v test_service_cycle_scenarios.py
          python - <<'PY'
          import json
          d=json.load(open('service_cycle_scenarios.json'))
          assert len(d['routes'])==3
          assert d['approved_service_cycles']==0
          assert all(x['connector']['status']!='NOT_EVALUATED' for x in d['routes'])
          print('Graph loops:',d['routable_loops'])
          print('Route scenarios:',[(x['candidate'],x['connector']['status'],len(x['scenarios'])) for x in d['routes']])
          PY
      - name: Evaluate 10/20/30 buses on fixed three-route sensitivity grid
        run: |
          cd projects/puerto-plata-gis
          python -m unittest -v test_fixed_shortlist_fleet_sensitivity.py
          python fixed_shortlist_fleet_sensitivity.py --input service_cycle_scenarios.json --output fixed_shortlist_fleet_sensitivity.json
          python - <<'PY'
          import json
          x=json.load(open('fixed_shortlist_fleet_sensitivity.json'))
          assert x["operational_approval"] is False
          if x["fleet_calculated"]:
              assert len(x["scenarios"])==36
              assert all(not s["physically_approved"] for s in x["scenarios"])
          else:
              assert x["status"]=="BLOCKED_INCOMPLETE_GRAPH_LOOPS"
          print("Fleet sensitivity:",x["status"])
          PY
      - name: Export directed real road geometry
        run: |
          cd projects/puerto-plata-gis
          python -m unittest -v test_route_geometry_qa.py
          python route_geometry_qa.py --routing valhalla_local_audit.json --report routed_geometry_qa.json --geojson routed_paths.geojson
          python - <<'PY'
          import json
          x=json.load(open('routed_geometry_qa.json'))
          assert x['routes_checked']>=19
          assert x['routes_with_both_shapes']==x['routes_checked']
          assert x['bus_turns_approved']==0
          PY
      - name: Audit whether routed paths reach candidate waypoints
        run: |
          cd projects/puerto-plata-gis
          python -m unittest -v test_route_waypoint_consistency.py
          python route_waypoint_consistency.py --candidates discovered_routes.geojson --routes routed_paths.geojson --output route_waypoint_consistency.json
          python - <<'PY'
          import json
          x=json.load(open('route_waypoint_consistency.json'))
          assert x['routes_checked']>=19
          assert x['bus_stop_accessibility_verified'] is False
          print("Routes with candidate waypoint deviations:",x["routes_with_waypoint_deviation"])
          PY
      - name: Save actual Valhalla operational evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("projects/puerto-plata-gis")
          routing=json.loads((p/"valhalla_local_audit.json").read_text())
          assert routing["routes"] and any(r["routed_both_directions"] for r in routing["routes"])
          report={"status":"EXECUTED_ROUTES_REQUIRE_TURN_REVIEW","routing":routing}
          (p/"valhalla_execution_evidence.json").write_text(json.dumps(report,indent=2))
          PY
          python projects/puerto-plata-gis/operational_validation.py --valhalla-evidence projects/puerto-plata-gis/valhalla_execution_evidence.json --output projects/puerto-plata-gis/operational_validation_evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puerto-plata-valhalla-rutas-locales
          path: |
            projects/puerto-plata-gis/valhalla_waypoint_constrained.json
            projects/puerto-plata-gis/valhalla_waypoint_constrained.geojson
            projects/puerto-plata-gis/valhalla_local_audit.json
            projects/puerto-plata-gis/valhalla_turn_audit.csv
            projects/puerto-plata-gis/route_waypoint_consistency.json
            projects/puerto-plata-gis/route_length_comparison.json
            projects/puerto-plata-gis/fixed_shortlist_fleet_sensitivity.json
            projects/puerto-plata-gis/service_cycle_scenarios.json
            projects/puerto-plata-gis/cycle_readiness.json
            projects/puerto-plata-gis/routed_geometry_qa.json
            projects/puerto-plata-gis/routed_paths.geojson
            projects/puerto-plata-gis/valhalla_execution_evidence.json
            projects/puerto-plata-gis/operational_validation_evidence.json
            projects/puerto-plata-gis/yutong_turn_risk_screen.json
            projects/puerto-plata-gis/data/valhalla/valhalla_build_manifest.json
          retention-days: 30

  road-width-shortlist:
