  network-proposal-audit:
    runs-on: ubuntu-latest
    needs: [exploratory-fleet-curve, destinations, route-competition]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-curva-flota-exploratoria
          path: projects/puerto-plata-gis
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-destinos-overture
          path: projects/puerto-plata-gis
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-competencia-redes
          path: projects/puerto-plata-gis
      - name: Screen each proposed network for POIs, transfers and peak headway
        run: |
          cd projects/puerto-plata-gis
          python -m unittest -v test_network_candidate_audit.py
          python network_candidate_audit.py --fleet fleet_10_20_30_exploratory.json --routes discovered_routes.geojson --pois destinations.geojson --output network_proposals_multicriteria.json
          python -m unittest -v test_rank_network_proposals.py
          python rank_network_proposals.py --input network_proposals_multicriteria.json --output ranked_network_proposals.json
          python -m unittest -v test_network_phasing_audit.py
          python network_phasing_audit.py --input network_proposals_multicriteria.json --output network_expansion_phasing.json
          python - <<'PY'
          import json
          x=json.load(open("network_proposals_multicriteria.json"))
          assert x["options_evaluated"]>0
          assert x["approved_operational_proposals"]==0
          assert all(p["operational_gate"]=="REJECTED_PENDING_CRITICAL_EVIDENCE" for p in x["proposals"])
          assert {p["budget"] for p in x["proposals"]}=={10,20,30}
          assert {p["scenario"] for p in x["proposals"]}=={"with_l1","without_l1_constraint"}
          print("Proposed networks evaluated:",x["options_evaluated"])
          print("Sample:",[(p["budget"],p["scenario"],[x["route"] for x in p["selected_routes"]],len(p["transfer_links"]),p["destinations"]["pois_reached_proxy"]) for p in x["proposals"][:6]])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puerto-plata-network-proposals-multicriteria
          path: |
            projects/puerto-plata-gis/network_proposals_multicriteria.json
            projects/puerto-plata-gis/ranked_network_proposals.json
            projects/puerto-plata-gis/network_expansion_phasing.json
          retention-days: 30

  exploratory-fleet-curve:
    runs-on: ubuntu-latest
    needs: [network, package, route-competition]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install graph projection and optimization libraries
        run: python -m pip install "osmnx==2.0.6" "ortools>=9.10,<10" "scipy>=1.11,<2"
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-red-vial-osmnx
          path: projects/puerto-plata-gis
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-gis-completo
          path: projects/puerto-plata-gis
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-competencia-redes
          path: projects/puerto-plata-gis
      - name: Solve three sensitivity scenarios, budgets 10/20/30, with and without L1
        run: |
          python projects/puerto-plata-gis/run_exploratory_curve.py
          python - <<'PY'
          import json
          d=json.load(open("projects/puerto-plata-gis/fleet_10_20_30_exploratory.json"))
          assert d["status"]=="EXPLORATORY_NOT_OPERATIONALLY_VALIDATED"
          assert len(d["scenarios"])==3
          assert all(len(s["with_l1"])==3 and len(s["without_l1_constraint"])==3 for s in d["scenarios"])
          assert all(x["validation_level"]=="EXPLORATORY_ONLY" for s in d["scenarios"] for arm in ("with_l1","without_l1_constraint") for x in s[arm] if x["status"] in ("OPTIMAL","FEASIBLE_NOT_PROVEN_OPTIMAL"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puerto-plata-curva-flota-exploratoria
          path: projects/puerto-plata-gis/fleet_10_20_30_exploratory.json
          retention-days: 30

