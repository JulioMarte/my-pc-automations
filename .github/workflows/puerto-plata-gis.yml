name: Puerto Plata GIS - build and verify
on:
  push:
    branches: ["feat/puerto-plata-transit-gis", dev]
    paths: ["projects/puerto-plata-gis/**", ".github/workflows/puerto-plata-gis.yml"]
  pull_request:
    paths: ["projects/puerto-plata-gis/**", ".github/workflows/puerto-plata-gis.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install rasterio
      - name: Generate geospatial population layer from WorldPop 2025
        run: python projects/puerto-plata-gis/build_population.py
      - name: Build provisional OSM/OSRM route
        run: python projects/puerto-plata-gis/build_route.py
      - name: Retrieve OSM road metadata (graceful fallback)
        run: python projects/puerto-plata-gis/build_roads.py
      - name: Build standalone interactive HTML
        run: python projects/puerto-plata-gis/make_standalone.py
      - name: Verify files and provenance
        run: python projects/puerto-plata-gis/verify.py
      - name: Check browser inline JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class X(HTMLParser):
              def __init__(self): super().__init__(); self.inside=False; self.parts=[]
              def handle_starttag(self,t,a):
                  if t=="script" and "src" not in dict(a): self.inside=True
              def handle_endtag(self,t):
                  if t=="script": self.inside=False
              def handle_data(self,d):
                  if self.inside: self.parts.append(d)
          x=X();x.feed(Path("projects/puerto-plata-gis/index.html").read_text());Path("/tmp/puerto-plata.js").write_text("\n".join(x.parts))
          PY
          node --check /tmp/puerto-plata.js
      - uses: actions/upload-artifact@v4
        with:
          name: puerto-plata-gis-completo
          path: |
            projects/puerto-plata-gis/index.html
            projects/puerto-plata-gis/population.json
            projects/puerto-plata-gis/initial_route.geojson
            projects/puerto-plata-gis/roads.geojson
            projects/puerto-plata-gis/Puerto_Plata_Linea_1_Mapa_Interactivo.html
            projects/puerto-plata-gis/README.md
          retention-days: 30

  network:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install graph dependencies
        run: python -m pip install "osmnx==2.0.6" "networkx>=3.4,<4"
      - name: Download directed road and pedestrian networks
        run: python projects/puerto-plata-gis/build_network.py
      - name: Verify network export
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('projects/puerto-plata-gis')
          r=json.loads((p/'network_report.json').read_text())
          for kind in ('drive','walk'):
              assert r['networks'][kind]['nodes']>100
              assert r['networks'][kind]['directed_edges']>100
              g=json.loads((p/f'{kind}_network.geojson').read_text())
              assert len(g['features'])==r['networks'][kind]['directed_edges']
              assert (p/f'{kind}.graphml').stat().st_size>1000
          print('Verified directed networks',r['networks'])
          PY
      - name: Publish network graphs
        uses: actions/upload-artifact@v4
        with:
          name: puerto-plata-red-vial-osmnx
          path: |
            projects/puerto-plata-gis/drive.graphml
            projects/puerto-plata-gis/walk.graphml
            projects/puerto-plata-gis/drive_network.geojson
            projects/puerto-plata-gis/walk_network.geojson
            projects/puerto-plata-gis/network_report.json
          retention-days: 30

  destinations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install Overture Maps downloader
        run: python -m pip install "overturemaps>=0.16,<1"
      - name: Retrieve and classify POIs
        run: python projects/puerto-plata-gis/build_destinations.py
      - name: Verify nonempty georeferenced POIs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('projects/puerto-plata-gis')
          d=json.loads((base/'destinations.geojson').read_text())
          s=json.loads((base/'destinations_report.json').read_text())
          assert d['type']=='FeatureCollection'
          assert len(d['features'])==s['classified'] and len(d['features'])>0
          for p in d['features']:
              x,y=p['geometry']['coordinates'][:2]
              assert -70.752<=x<=-70.620 and 19.740<=y<=19.836
              assert p['properties']['name'] and p['properties']['type']!='other'
          print('Verified Overture POIs:',s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: puerto-plata-destinos-overture
          path: |
            projects/puerto-plata-gis/destinations.geojson
            projects/puerto-plata-gis/destinations_report.json
          retention-days: 30

  service-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Test schedule, frequency, fleet and transfer assumptions
        run: |
          cd projects/puerto-plata-gis
          python -m unittest -v test_transit_planner.py
          python transit_planner.py --output network_scenarios.json
          python - <<'PY'
          import json
          p=json.load(open('network_scenarios.json'))
          assert p['results']['fleet']['fleet_total']==21
          assert len(p['results']['periods'])==6
          print('Plan validated:',p['results']['fleet'])
          PY
      - name: Validate offline planner JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Parser(HTMLParser):
              def __init__(self):super().__init__();self.active=False;self.text=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="script" and not any(k=="src" for k,_ in attrs):self.active=True
              def handle_endtag(self,tag):
                  if tag=="script":self.active=False
              def handle_data(self,d):
                  if self.active:self.text.append(d)
          p=Parser();p.feed(Path('projects/puerto-plata-gis/frequency_planner.html').read_text())
          Path('/tmp/puerto-plata-frequency.js').write_text('\n'.join(p.text))
          PY
          node --check /tmp/puerto-plata-frequency.js
      - uses: actions/upload-artifact@v4
        with:
          name: puerto-plata-frecuencias-transbordos
          path: |
            projects/puerto-plata-gis/frequency_planner.html
            projects/puerto-plata-gis/network_scenarios.json
            projects/puerto-plata-gis/transit_planner.py
            projects/puerto-plata-gis/test_transit_planner.py
          retention-days: 30

  synthetic-od:
    runs-on: ubuntu-latest
    needs: [package, destinations]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify synthetic origin-destination model
        run: |
          cd projects/puerto-plata-gis
          python -m unittest -v test_od_synthetic.py
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-gis-completo
          path: projects/puerto-plata-gis
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-destinos-overture
          path: projects/puerto-plata-gis
      - name: Generate time-of-day OD opportunity matrix
        run: |
          python projects/puerto-plata-gis/build_od_synthetic.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('projects/puerto-plata-gis/od_synthetic.json').read_text())
          assert len(p['periods'])==6
          assert p['resident_coverage_estimate']>0
          assert p['metadata']['method'].startswith('synthetic')
          print('Synthetic, non-observed OD report validated')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: puerto-plata-od-sintetica
          path: projects/puerto-plata-gis/od_synthetic.json
          retention-days: 30

  street-access:
    runs-on: ubuntu-latest
    needs: [network, package, destinations]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install geographic graph analysis
        run: python -m pip install "osmnx==2.0.6" "networkx>=3.4,<4" scipy
      - name: Regression tests for street access
        run: |
          cd projects/puerto-plata-gis
          python -m unittest -v test_network_access.py test_network_scenarios.py
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-red-vial-osmnx
          path: projects/puerto-plata-gis
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-gis-completo
          path: projects/puerto-plata-gis
      - name: Estimate 500m directed street access
        run: |
          python projects/puerto-plata-gis/network_access.py --sensitivity
          python - <<'PY'
          import json
          p=json.load(open("projects/puerto-plata-gis/network_access_report.json"))
          assert p["total_stops"]>=20 and p["snapped_stops"]>=15
          assert p["residents"]>0 and p["residents"]<=45000
          assert p["accounting_difference"]==0
          assert len(p["sensitivity"])==3
          assert p["population_outside_study_bbox"]>0
          print("Street network access:",p)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: puerto-plata-destinos-overture
          path: projects/puerto-plata-gis
      - name: Compare network-wide walking access
        run: |
          python projects/puerto-plata-gis/compare_network_scenarios.py
          python -c "import json; d=json.load(open('projects/puerto-plata-gis/network_scenario_comparison.json')); assert len(d['scenarios']) == 1; assert not d['scenarios'][0]['bus_geometry_validated']"
      - uses: actions/upload-artifact@v4
        with:
          name: puerto-plata-acceso-peatonal-red
          path: |
            projects/puerto-plata-gis/network_access_report.json
            projects/puerto-plata-gis/network_scenario_comparison.json
          retention-days: 30
