          print("Yutong inspection priority:",x["tasks_by_route"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: puerto-plata-road-width-shortlist
          path: |
            projects/puerto-plata-gis/priority_road_width_transects.geojson
            projects/puerto-plata-gis/yutong_field_survey_queue.json
