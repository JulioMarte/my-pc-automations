# CI del monorepo my-pc-automations.
# El proyecto local-proxy vive en local-proxy/, por eso defaults.run.working-directory.
name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Cancela ejecuciones superadas de la misma rama/PR (ahorra minutos).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: local-proxy/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: docker build + smoke + e2e
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: local-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build de la imagen
        run: docker build -t local-proxy:ci .
      - name: Smoke test (gateway con puerto mapeado)
        run: |
          set -euo pipefail
          printf '[]\n' > "$RUNNER_TEMP/exits.json"
          docker run -d --name lp-smoke \
            -e GATEWAY_HOST=0.0.0.0 \
            -e PROXY_USERS=test:test \
            -e STATS_TOKEN=tok \
            -p 18888:8888 \
            -v "$RUNNER_TEMP/exits.json:/app/exits.json:ro" \
            local-proxy:ci
          status="missing"
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' lp-smoke 2>/dev/null || echo missing)"
            if [ "$status" = "healthy" ]; then break; fi
            sleep 1
          done
          echo "health=$status"
          test "$status" = "healthy"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18888/healthz)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18888/panel)" = "200"
          curl -s http://127.0.0.1:18888/healthz
      - name: End-to-end en Docker
        env:
          E2E_IMAGE: local-proxy:ci
          E2E_SKIP_BUILD: '1'
        run: bash scripts/e2e-docker.sh
      - name: Limpieza
        if: always()
        run: |
          docker rm -f lp-smoke >/dev/null 2>&1 || true
          docker image rm -f local-proxy:ci >/dev/null 2>&1 || true
